name: Build TLS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:
  build:
    name: Build Linux aarch64 (chrome152 TLS profile)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container: rust:1.96.1-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils cmake libclang-dev python3 ca-certificates

      - name: Build and package
        shell: bash
        run: >-
          python3 scripts/release.py
          --version "1.1.24+tls.1"
          --expected-target aarch64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moli-tls-aarch64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
