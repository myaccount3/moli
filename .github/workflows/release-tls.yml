name: Build TLS Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container: rust:1.96.1-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils cmake libclang-dev python3 ca-certificates

      - name: Build and package
        shell: bash
        run: >-
          python3 scripts/release.py
          --version "1.1.24+tls.3"
          --expected-target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moli-tls-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < rust-toolchain)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustc --version

      - name: Build and package
        shell: bash
        run: >-
          python3 scripts/release.py
          --version "1.1.24+tls.3"
          --expected-target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moli-tls-macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows ${{ matrix.arch }}
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = (Get-Content rust-toolchain -Raw).Trim()
          rustup toolchain install $toolchain --profile minimal --no-self-update
          rustc --version

      - name: Build and package
        shell: pwsh
        run: >-
          python scripts/release.py
          --version "1.1.24+tls.3"
          --expected-target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moli-tls-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
